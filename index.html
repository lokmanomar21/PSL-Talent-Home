<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSL Talent Guide · Malaysia</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0f2044; --navy-mid: #1a3460;
    --accent: #e8472a; --orange: #d4621a;
    --white: #ffffff; --light: #f4f6fb;
    --text: #1e2d45; --muted: #6b7fa3; --border: #dce3ef;
  }

  html, body {
    height: 100%;
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(160deg, #0a1830 0%, #0f2044 45%, #1a3460 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }

  .hero {
    width: 100%;
    max-width: 620px;
    text-align: center;
    position: relative;
  }

  /* Subtle background glow */
  .hero::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 75% 40%, rgba(200,134,10,0.07) 0%, transparent 55%),
      radial-gradient(ellipse at 20% 70%, rgba(232,71,42,0.06) 0%, transparent 50%);
    pointer-events: none;
  }

  /* Logo */
  .hero-logo {
    display: inline-flex; align-items: center; gap: 12px;
    margin-bottom: 40px;
    position: relative; z-index: 1;
  }
  .hero-logo-icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--accent), var(--orange));
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 6px 20px rgba(232,71,42,0.35);
  }
  .hero-logo-text { text-align: left; }
  .hero-logo-text strong {
    font-family: 'Playfair Display', serif;
    color: var(--white); font-size: 18px;
    font-weight: 600; display: block;
  }
  .hero-logo-text span {
    color: rgba(255,255,255,0.42);
    font-size: 12.5px;
  }

  /* Heading */
  h1 {
    font-family: 'Playfair Display', serif;
    color: var(--white);
    font-size: clamp(30px, 6vw, 48px);
    font-weight: 600;
    line-height: 1.2;
    margin-bottom: 14px;
    position: relative; z-index: 1;
  }
  h1 em { font-style: italic; color: rgba(255,255,255,0.55); }

  .subtitle {
    color: rgba(255,255,255,0.45);
    font-size: 15px; line-height: 1.65;
    max-width: 440px; margin: 0 auto 38px;
    position: relative; z-index: 1;
  }

  /* Search */
  .search-wrap { position: relative; z-index: 2; }

  .search-box {
    display: flex; align-items: center;
    background: var(--white);
    border-radius: 18px;
    padding: 6px 6px 6px 22px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.28);
    gap: 12px;
  }
  .search-icon { color: var(--muted); flex-shrink: 0; }
  .search-box input {
    flex: 1; border: none; outline: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; color: var(--text);
    background: transparent; padding: 9px 0;
  }
  .search-box input::placeholder { color: var(--muted); }
  .search-btn {
    background: linear-gradient(135deg, var(--accent), var(--orange));
    border: none; border-radius: 13px;
    padding: 11px 26px;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: opacity 0.15s, transform 0.1s;
    box-shadow: 0 4px 14px rgba(232,71,42,0.3);
    white-space: nowrap;
  }
  .search-btn:hover { opacity: 0.9; }
  .search-btn:active { transform: scale(0.97); }

  /* Results dropdown */
  .search-results {
    background: var(--white);
    border-radius: 16px;
    margin-top: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    overflow: hidden;
    display: none;
    text-align: left;
  }
  .search-results.active { display: block; }
  .no-results {
    padding: 16px 20px;
    font-size: 13px; color: var(--muted); text-align: center;
  }
  .result-item {
    display: flex; align-items: center; gap: 13px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s;
    text-decoration: none;
  }
  .result-item:last-child { border-bottom: none; }
  .result-item:hover { background: var(--light); }
  .result-icon { font-size: 22px; flex-shrink: 0; }
  .result-body { flex: 1; }
  .result-title { font-size: 13.5px; font-weight: 600; color: var(--navy); }
  .result-desc { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .result-arrow { color: var(--border); font-size: 16px; flex-shrink: 0; }

  /* Common searches */
  .common {
    margin-top: 20px;
    display: flex; flex-wrap: wrap;
    gap: 8px; justify-content: center;
    position: relative; z-index: 1;
  }
  .common-label {
    font-size: 12px;
    color: rgba(255,255,255,0.35);
    width: 100%; margin-bottom: 2px;
  }
  .tag {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 22px;
    padding: 6px 16px;
    font-size: 12.5px;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }
  .tag:hover {
    background: rgba(255,255,255,0.16);
    color: var(--white);
    border-color: rgba(255,255,255,0.25);
  }

  @media(max-width: 480px) {
    .search-btn span { display: none; }
    .search-btn { padding: 11px 16px; }
  }
</style>
</head>
<body>
<div class="hero">

  <!-- Logo -->
  <div class="hero-logo">
    <div class="hero-logo-icon">🧭</div>
    <div class="hero-logo-text">
      <strong>PSL Talent Guide</strong>
      <span>Malaysia · PeerHealth</span>
    </div>
  </div>

  <!-- Heading -->
  <h1>How can we <em>help you</em> today?</h1>
  <p class="subtitle">Search for HR resources, policies, benefits, and more — or ask our AI assistant directly.</p>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-box">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search policies, leave, benefits, contacts…"
        oninput="doSearch(this.value)"
        onkeydown="if(event.key==='Enter')doSearch(this.value,true)">
      <button class="search-btn" onclick="doSearch(document.getElementById('searchInput').value,true)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        <span>Search</span>
      </button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <!-- Common searches -->
  <div class="common">
    <div class="common-label">Common searches:</div>
    <button class="tag" onclick="trigger('annual leave')">Annual leave</button>
    <button class="tag" onclick="trigger('public holidays')">Public holidays</button>
    <button class="tag" onclick="trigger('medical benefits')">Medical</button>
    <button class="tag" onclick="trigger('expense claim')">Expense claim</button>
    <button class="tag" onclick="trigger('contact HR')">Contact HR</button>
    <button class="tag" onclick="trigger('overtime')">Overtime</button>
    <button class="tag" onclick="trigger('sick leave')">Sick leave</button>
    <button class="tag" onclick="trigger('salary')">Salary</button>
  </div>

</div>

<script>
const KB = [

  { title:"MiCARE Medical Insurance", desc:"GP: RM2,000/year. Specialist: RM2,500/year (needs GP referral). Portal: eclaims.micaresvc.com", url:"https://eclaims.micaresvc.com/login.aspx", icon:"🏥", tags:["medical","insurance","micare","doctor","hospital","clinic","gp","specialist","outpatient","panel"] },
  { title:"Wellness Benefit", desc:"RM800/year for dental, optical, health screening. Includes spouse & children.", url:"https://sites.google.com/pslgroup.com/psltalentguidemly/home/benefits", icon:"💊", tags:["wellness","dental","optical","health","benefit","claim","gigi","mata"] },
  { title:"Expense Claims (Maconomy)", desc:"Submit via Maconomy on desktop. Overhead project code: 630000008. Must submit within 90 days.", url:"https://sites.google.com/pslgroup.com/psltalentguidemly/home/policies-and-procedures", icon:"💰", tags:["expense","claim","maconomy","reimburse","receipt","travel claim","tuntutan"] },
  { title:"Internet Reimbursement", desc:"Max RM180/month for home internet. Submit monthly via Maconomy (confirmed employees only).", url:"https://sites.google.com/pslgroup.com/psltalentguidemly/home/policies-and-procedures", icon:"🌐", tags:["internet","wifi","broadband","reimbursement","home office","internet claim"] },
  { title:"Salary & Payroll", desc:"Paid on the 28th of each month. 13th month pay at year end. Contact: ben.tan@pslgroup.com", url:"https://sites.google.com/pslgroup.com/psltalentguidemly/home/handbook", icon:"💵", tags:["salary","payroll","pay","payment","wage","payslip","gaji","13th month"] },
  { title:"Contact HR / Talent", desc:"lokman.omar@pslgroup.com or gerardo.zamora@pslgroup.com — for benefits and career questions.", url:"mailto:lokman.omar@pslgroup.com", icon:"👤", tags:["contact","hr","talent","human resources","lokman","gerardo","hubungi"] },
  { title:"Contact Finance", desc:"For payroll queries: ben.tan@pslgroup.com", url:"mailto:ben.tan@pslgroup.com", icon:"📊", tags:["finance","payroll","contact finance","ben tan","kewangan"] },
  { title:"Contact IT Support", desc:"For all technical issues, open a ticket by emailing the IT team.", url:"mailto:support.pslasia@pslgroup.com", icon:"💻", tags:["it","tech","technical","support","laptop","computer","it support","it help","it ticket"] },

  { title:"LinkedIn Learning", desc:"Company-wide access to thousands of courses. Speak to manager then contact Talent.", url:"https://docs.google.com/spreadsheets/d/1ooJiW4z4QIt30Jhk-a8Sd5xCxx-ClExhfdGlE3NZ6yU/edit", icon:"📚", tags:["linkedin","learning","training","course","development","upskill","latihan"] },
  { title:"HRD Corp Training", desc:"Available after 1 year service. Submit Training Form 1 month before. Contact lokman.omar@pslgroup.com", url:"https://docs.google.com/forms/d/e/1FAIpQLSeWfMReJxEE4FiD-ghwLuah5bFRt-A_wTuwIZtHIhvnJlHozw/viewform", icon:"🎓", tags:["training","hrd","hrdc","course","development","external training","hrdf"] },
  { title:"Maternity & Paternity Leave", desc:"Maternity: 98 calendar days full pay. Paternity: 7 consecutive days after probation.", url:"https://sites.google.com/pslgroup.com/psltalentguidemly/home/handbook", icon:"👶", tags:["maternity","paternity","baby","confinement","parental","bersalin","cuti bersalin"] },
  { title:"Ultiflex (Work from Home)", desc:"PSL's hybrid work model. In-person required for new hire day 1 and key team meetings.", url:"https://sites.google.com/pslgroup.com/psltalentguidemly/home/policies-and-procedures", icon:"🏠", tags:["ultiflex","wfh","work from home","remote","hybrid","telecommute","kerja dari rumah"] },

  { title:"Achiever's Paradise Awards", desc:"Peer-nominated recognition program via Quickbase. Quarterly cash prizes, $500 annual cap.", url:"https://pslgroup.quickbase.com/nav/app/bqyku88pg/action/appoverview", icon:"🏆", tags:["achiever","award","recognition","nominate","prize","reward","quickbase"] },
  { title:"Anniversary Awards", desc:"RM2,000 (5yr) | RM5,000 (10yr) | RM6,000 (15/20/25yr+) + 5 extra leave days at 10yr milestones.", url:"https://sites.google.com/pslgroup.com/psltalentguidemly/home/benefits", icon:"🎂", tags:["anniversary","award","years service","milestone","loyalty","service award"] },
  { title:"13th Month Pay", desc:"One month basic salary paid at end of calendar year (December). Pro-rated for first year.", url:"https://sites.google.com/pslgroup.com/psltalentguidemly/home/handbook", icon:"🎁", tags:["13th month","bonus","year end","thirteenth","december bonus"] },
  { title:"Information Security Policy", desc:"No unauthorized software. Passwords min 8 chars. Report incidents to support.pslasia@pslgroup.com", url:"https://sites.google.com/pslgroup.com/psltalentguidemly/home/policies-and-procedures", icon:"🔒", tags:["security","password","information security","data","confidential","pisp","it policy"] },
  { title:"Dougall PSL (AI Assistant)", desc:"PSL's internal AI tool. Sign in with your PSL email at dougallpsl.com to get started.", url:"https://www.dougallpsl.com", icon:"🤖", tags:["ai","dougall","assistant","artificial intelligence","dougall psl","psl ai tool"] },
  { title:"Upcoming Events 2026", desc:"Fun Art Collage, Pickleball, Kopi & Kakis, Holiday Party and more throughout the year.", url:"https://sites.google.com/pslgroup.com/psltalentguidemly/home/yearly-events-calendar-2023", icon:"🎉", tags:["event","events","activities","team building","calendar","fun","upcoming"] },
  { title:"Email Etiquette Guide", desc:"Best practices: subject lines, urgent vs action, To vs CC, reply-all, attachments.", url:"https://drive.google.com/file/d/1J_DB9IDOBBwIwTB7G2fHJXWCehW8Wfc2/view", icon:"✉️", tags:["email","etiquette","communication","professional","reply","cc","best practice"] },
  { title:"About PSL Group", desc:"Global organisation putting information at the service of medicine. Watch our welcome video.", url:"https://sites.google.com/pslgroup.com/psltalentguidemly/home/about-us", icon:"🏢", tags:["about","culture","vision","mission","psl","values","welcome","company"] },
  { title:"Policies & Procedures", desc:"All company policies including travel, telecommuting, freelancer process, Mac IT guide.", url:"https://sites.google.com/pslgroup.com/psltalentguidemly/home/policies-and-procedures", icon:"📋", tags:["policy","policies","procedure","rules","conduct","compliance","regulation"] },
  { title:"Employee Handbook", desc:"Full handbook covering employment terms, conduct, leave, compensation and more.", url:"https://docs.google.com/document/d/13R1oIRzuxysDC6y4HYEQi3EQTh7JjjcIV1W6XgWRD94/edit", icon:"📖", tags:["handbook","manual","employee manual","guide","employment","terms"] },
  { title:"Compassionate Leave", desc:"Up to 3 working days for death of immediate family member.", url:"https://sites.google.com/pslgroup.com/psltalentguidemly/home/handbook", icon:"🌹", tags:["compassionate","death","bereavement","family","funeral","cuti kematian"] },
  { title:"Travel Policy", desc:"Airfare, hotel, meals, car rental and reimbursement rules for business travel.", url:"https://sites.google.com/pslgroup.com/psltalentguidemly/home/policies-and-procedures", icon:"✈️", tags:["travel","flight","hotel","business travel","travel claim","accommodation"] },
  { title:"Grievance Procedure", desc:"Raise grievance with Line Manager within 7 days. 3-step process: raise → hearing → appeal.", url:"https://sites.google.com/pslgroup.com/psltalentguidemly/home/handbook", icon:"⚖️", tags:["grievance","complaint","dispute","appeal","hearing","aduan"] },
  { title:"Disciplinary Process", desc:"PIP → Written Warning → Suspension → Dismissal. Contact Talent for guidance.", url:"https://sites.google.com/pslgroup.com/psltalentguidemly/home/handbook", icon:"📝", tags:["discipline","warning","suspension","termination","dismissal","show cause","pip"] },
];

function doSearch(q, force) {
  const query = q.toLowerCase().trim();
  const el = document.getElementById('searchResults');
  if (!query) { el.classList.remove('active'); return; }
  const hits = KB.filter(item =>
    item.tags.some(t => t === query || t.startsWith(query) || query.startsWith(t)) ||
    item.title.toLowerCase().includes(query)
  ).slice(0, 6);

  if (!hits.length) {
    el.innerHTML = `<div class="no-results">No results found for "<strong>${q}</strong>" — try a different keyword.</div>`;
  } else {
    el.innerHTML = hits.map(h => `
      <a class="result-item" href="${h.url}" target="_blank">
        <span class="result-icon">${h.icon}</span>
        <span class="result-body">
          <span class="result-title">${h.title}</span>
          <span class="result-desc">${h.desc}</span>
        </span>
        <span class="result-arrow">›</span>
      </a>`).join('');
  }
  el.classList.add('active');
}

function trigger(q) {
  document.getElementById('searchInput').value = q;
  doSearch(q, true);
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap'))
    document.getElementById('searchResults').classList.remove('active');
});
</script>
</body>
</html>
